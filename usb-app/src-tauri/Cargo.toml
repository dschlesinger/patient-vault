[package]
name = "patient-vault-usb"
version = "0.1.0"
description = "PatientVault USB App"
authors = []
edition = "2021"

[lib]
name = "patient_vault_usb_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
anyhow = "1"

# Cryptography (pure Rust — no C dependencies, Tails OS compatible)
ml-kem = { version = "0.3", features = ["zeroize"] }
x25519-dalek = { version = "2", features = ["zeroize"] }
aes-gcm = "0.10"
hkdf = "0.12"
sha2 = "0.10"
rand = "0.8"
zeroize = { version = "1", features = ["derive"] }
hex = "0.4"
base64 = "0.22"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
